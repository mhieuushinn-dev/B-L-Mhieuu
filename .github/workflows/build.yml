name: Build ShinnH4K IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== project.yml ==="
          cat project.yml
          echo "=== exploit/ ==="
          ls -la exploit/ || echo "MISSING"
          echo "=== kexploit/ ==="
          ls -la kexploit/ || echo "MISSING"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          ls -la ShinnH4K.xcodeproj/
          wc -l ShinnH4K.xcodeproj/project.pbxproj

      - name: List schemes
        run: xcodebuild -list -project ShinnH4K.xcodeproj

      - name: Build
        run: |
          xcodebuild \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShinnH4K.app Payload/
          zip -r ShinnH4K.ipa Payload
          ls -la ShinnH4K.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-IPA
          path: ShinnH4K.ipa