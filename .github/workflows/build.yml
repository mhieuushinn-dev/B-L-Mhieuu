name: Build ShinnH4K IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug repo structure
        run: |
          echo "========== REPO ROOT =========="
          ls -la
          echo ""
          echo "========== project.yml =========="
          cat project.yml || echo "MISSING project.yml"
          echo ""
          echo "========== Info.plist =========="
          ls -la Info.plist || echo "MISSING Info.plist"
          echo ""
          echo "========== Bridging =========="
          ls -la ShinnH4K-Bridging-Header.h || echo "MISSING Bridging"
          echo ""
          echo "========== exploit/ =========="
          ls -la exploit/ || echo "MISSING exploit/"
          echo ""
          echo "========== kexploit/ =========="
          ls -la kexploit/ || echo "MISSING kexploit/"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml 2>&1
          echo "========== Exit: $? =========="
          ls -la ShinnH4K.xcodeproj/ || echo "MISSING xcodeproj"
          echo "========== pbxproj size =========="
          wc -c ShinnH4K.xcodeproj/project.pbxproj || echo "MISSING pbxproj"

      - name: Verify scheme
        run: xcodebuild -list -project ShinnH4K.xcodeproj

      - name: Build App
        run: |
          xcodebuild \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShinnH4K.app Payload/
          zip -r ShinnH4K.ipa Payload
          ls -la ShinnH4K.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-IPA
          path: ShinnH4K.ipa