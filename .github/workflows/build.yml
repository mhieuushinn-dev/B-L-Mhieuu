name: Build ShinnH4K IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo ""
          echo "=== exploit/ ==="
          ls -la exploit/ 2>/dev/null || echo "MISSING"
          echo ""
          echo "=== kexploit/ ==="
          ls -la kexploit/ 2>/dev/null || echo "MISSING"
          echo ""
          echo "=== helpers/ ==="
          ls -la helpers/ 2>/dev/null || echo "MISSING"

      - name: Show project.yml
        run: |
          echo "=== project.yml content ==="
          cat project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "=== After generate ==="
          ls -la
          echo ""
          echo "=== pbxproj head ==="
          head -50 ShinnH4K.xcodeproj/project.pbxproj || echo "MISSING pbxproj"

      - name: Verify scheme
        run: xcodebuild -list -project ShinnH4K.xcodeproj

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ShinnH4K.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        if: success()
        run: |
          APP_PATH=$(find build/ShinnH4K.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then exit 1; fi
          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          rm -rf "build/Payload/${APP_NAME}.app/_CodeSignature" || true
          rm -f  "build/Payload/${APP_NAME}.app/embedded.mobileprovision" || true
          cd build
          zip -qr ShinnH4K.ipa Payload
          cd ..
          ls -la build/ShinnH4K.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-unsigned-ipa
          path: build/ShinnH4K.ipa
          retention-days: 30